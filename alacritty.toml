[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[terminal]
osc52 = "CopyPaste"

# [env]
# TERM = "xterm-256color"

[window]
decorations = "None"

[terminal.shell]
program = "/opt/homebrew/bin/fish"
args = ["--login"]

